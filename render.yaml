services:
  - type: web
    name: ai-connect-meme-trader-v5
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: worker
    name: ai-connect-meme-trader-scanner
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.scanner
    envVars:
      - key: DATABASE_URL
        sync: false
